<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRRS @ IACAPAP 2026 — Schedule of Talks & Posters</title>
<style>
  :root{
    /* brand */
    --navy:#283A6B; --teal:#1C7293; --coral:#E85A60;
    /* surfaces — cool neutral greys */
    --bg:#eef1f5; --card:#ffffff; --thead:#f4f6f9;
    --ink:#1f2533; --muted:#697485; --line:#e3e7ee; --hover:#f7f9fc;
    /* type accents (text/strong) */
    --sym:#1C7293; --oral:#283A6B; --poster:#9a6a00; --keynote:#7a3b8f; --ceremony:#c0484e;
    /* type soft fills */
    --sym-bg:#e6f0f4; --oral-bg:#e8ebf3; --poster-bg:#f6eeda; --keynote-bg:#f0e7f4; --ceremony-bg:#fbe7e8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       line-height:1.45;}
  header{background:linear-gradient(120deg,var(--navy) 0%,#22507e 55%,var(--teal) 100%);color:#fff;padding:30px 22px 24px;}
  header h1{margin:0 0 4px;font-size:1.5rem;letter-spacing:.2px}
  header .sub{opacity:.92;font-size:.95rem}
  header .meta{margin-top:10px;font-size:.82rem;opacity:.82}
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px 60px}
  .controls{position:sticky;top:0;z-index:20;background:var(--bg);
            padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input[type=search]{flex:1 1 240px;min-width:200px;padding:10px 12px;border:1px solid var(--line);
      border-radius:10px;font-size:.95rem;background:#fff}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;padding:9px 13px;font-size:.85rem;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--navy);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.8rem;
        cursor:pointer;color:var(--muted)}
  .chip.on{border-color:var(--navy);color:var(--navy);font-weight:600;box-shadow:inset 0 0 0 1px var(--navy)}
  .count{font-size:.8rem;color:var(--muted);margin:12px 2px 4px}
  .daygroup{margin-top:18px}
  .dayhd{font-size:1.05rem;font-weight:700;color:var(--navy);margin:14px 2px 8px;
         display:flex;align-items:center;gap:10px}
  .dayhd .pill{font-size:.72rem;font-weight:600;background:var(--navy);color:#fff;border-radius:999px;padding:2px 9px}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;
        box-shadow:0 1px 2px rgba(40,58,107,.06),0 2px 8px rgba(40,58,107,.04);margin-bottom:8px}
  thead th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
           padding:9px 12px;border-bottom:1px solid var(--line);background:var(--thead);white-space:nowrap}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--hover)}
  .who{font-weight:700}
  .who small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:1px}
  .nick{font-weight:600;color:var(--teal)}
  .rolebadge{display:inline-block;font-size:.66rem;font-weight:700;border-radius:5px;padding:1px 6px;
             margin-left:6px;vertical-align:middle}
  .rolebadge.fellow{background:var(--sym-bg);color:var(--teal)}
  .rolebadge.mentor{background:var(--keynote-bg);color:var(--keynote)}
  .time{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
  .code{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ttitle{color:var(--ink)}
  .typetag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:6px;padding:3px 9px;white-space:nowrap;border:1px solid transparent}
  .typetag.Symposium{background:var(--sym-bg);color:var(--sym);border-color:#cfe2ea}
  .typetag.OralPresentation{background:var(--oral-bg);color:var(--oral);border-color:#d3d9ea}
  .typetag.Poster{background:var(--poster-bg);color:var(--poster);border-color:#eaddbf}
  .typetag.KeynoteSession{background:var(--keynote-bg);color:var(--keynote);border-color:#e2d2ea}
  .typetag.OpeningCeremony{background:var(--ceremony-bg);color:var(--ceremony);border-color:#f4cdcf}
  .sub{font-size:.74rem;color:var(--muted);margin-top:3px}
  .sub.chair{color:var(--coral);font-weight:700}
  .flag{font-size:.78rem;color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  footer{max-width:1120px;margin:0 auto;padding:20px 18px 40px;color:var(--muted);font-size:.78rem}
  @media(max-width:680px){
    .wrap{padding:0 12px 50px}
    .row{gap:6px}
    input[type=search]{flex:1 1 100%}
    .seg{flex:1 1 auto}
    .seg button{flex:1 1 auto}
    header{padding:22px 16px 18px}
    header h1{font-size:1.25rem}

    /* turn each table into a stack of cards */
    table{box-shadow:none;background:transparent;border-radius:0}
    thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    tbody tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
             padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(40,58,107,.05)}
    tbody tr:hover{background:var(--card)}
    tbody td{display:flex;gap:10px;align-items:flex-start;border:0;padding:3px 0;font-size:.92rem}
    tbody td:before{content:attr(data-label);flex:0 0 76px;color:var(--muted);
                    font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;font-weight:700;
                    padding-top:2px}
    /* title row: bigger, full width feel */
    tbody td[data-label="Title"]{flex-direction:column;gap:2px;margin-top:4px;
                    border-top:1px solid var(--line);padding-top:8px}
    tbody td[data-label="Title"]:before{flex-basis:auto}
    .ttitle{font-weight:600;line-height:1.35}
    .who small{display:inline;margin-left:0}
    .code{font-size:.95rem}
  }
</style>
</head>

  code:it.code, title:it.title, type:it.type, sub:it.sub, day:it.day, time:it.time
})));

let state={role:"all", type:"all", view:"day", q:""};

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function timeKey(t){let m=t.match(/(\d{2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):0}
function dispName(r){
  // insert nickname after first name, only if it adds info
  const parts=r.name.split(" ");
  const first=parts[0];
  const call=(r.call||"").trim();
  if(!call || call.toLowerCase()===first.toLowerCase()) return esc(r.name);
  return esc(first)+' <span class="nick">('+esc(call)+')</span> '+esc(parts.slice(1).join(" "));
}

function match(r){
  if(state.role!=="all" && r.role!==state.role) return false;
  if(state.type!=="all" && r.type!==state.type) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const hay=(r.name+" "+r.call+" "+r.title+" "+r.code+" "+r.country+" "+r.inst+" "+r.type+" "+r.sub).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function roleBadge(role){return '<span class="rolebadge '+role+'">'+(role==="fellow"?"Fellow":"Mentor")+'</span>'}
function typeTag(t){var slug=t.replace(/[^A-Za-z]+/g,"");return '<span class="typetag '+slug+'">'+t+'</span>'}
function subLine(sub){
  const isChair=/chair/i.test(sub);
  return '<div class="sub'+(isChair?' chair':'')+'">'+esc(sub)+'</div>';
}

function renderDay(rows){
  let html="";
  Object.keys(DAYS).forEach(day=>{
    let rs=rows.filter(r=>r.day===day).sort((a,b)=>timeKey(a.time)-timeKey(b.time)||a.code.localeCompare(b.code));
    if(!rs.length) return;
    html+='<div class="daygroup"><div class="dayhd"><span class="pill">'+DAYS[day].short+'</span>'+DAYS[day].lbl+
          ' <span style="font-weight:400;color:var(--muted);font-size:.8rem">('+rs.length+')</span></div><table>'+
          '<thead><tr><th>Time</th><th>Code</th><th>Type</th><th>Presenter</th><th>Title</th></tr></thead><tbody>';
    rs.forEach(r=>{
      html+='<tr>'+
        '<td class="time" data-label="Time">'+esc(r.time)+'</td>'+
        '<td class="code" data-label="Code">'+esc(r.code)+'</td>'+
        '<td data-label="Type">'+typeTag(r.type)+'</td>'+
        '<td class="who" data-label="Presenter">'+dispName(r)+roleBadge(r.role)+'<small>'+esc(r.country)+'</small></td>'+
        '<td data-label="Title"><span class="ttitle">'+esc(r.title)+'</span>'+subLine(r.sub)+'</td>'+
      '</tr>';
    });
    html+='</tbody></table></div>';
  });
  return html||'<div class="empty">No sessions match these filters.</div>';
}

function renderPerson(rows){
  let people=[...new Set(rows.map(r=>r.name))].sort((a,b)=>a.localeCompare(b));
  let html="";
  people.forEach(nm=>{
    let rs=rows.filter(r=>r.name===nm).sort((a,b)=>a.day.localeCompare(b.day)||timeKey(a.time)-timeKey(b.time));
    let r0=rs[0];
    html+='<div class="daygroup"><div class="dayhd">'+dispName(r0)+roleBadge(r0.role)+
          ' <span style="font-weight:400;color:var(--muted);font-size:.8rem">— '+esc(r0.inst)+'</span></div><table>'+
          '<thead><tr><th>Day</th><th>Time</th><th>Code</th><th>Type</th><th>Title</th></tr></thead><tbody>';
    rs.forEach(r=>{
      html+='<tr>'+
        '<td class="time" data-label="Day">'+DAYS[r.day].short+'</td>'+
        '<td class="time" data-label="Time">'+esc(r.time)+'</td>'+
        '<td class="code" data-label="Code">'+esc(r.code)+'</td>'+
        '<td data-label="Type">'+typeTag(r.type)+'</td>'+
        '<td data-label="Title"><span class="ttitle">'+esc(r.title)+'</span>'+subLine(r.sub)+'</td>'+
      '</tr>';
    });
    html+='</tbody></table></div>';
  });
  return html||'<div class="empty">No sessions match these filters.</div>';
}

function render(){
  let rows=ROWS.filter(match);
  document.getElementById("out").innerHTML = state.view==="day"?renderDay(rows):renderPerson(rows);
  let nP=new Set(rows.map(r=>r.name)).size;
  document.getElementById("count").textContent=rows.length+" activities · "+nP+" people"+
     (state.role!=="all"?" · "+state.role+"s":"")+(state.type!=="all"?" · "+state.type:"");
}

document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});
document.querySelectorAll("#roleSeg button").forEach(b=>b.onclick=()=>{
  state.role=b.dataset.role;document.querySelectorAll("#roleSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render();});
document.querySelectorAll("#viewSeg button").forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view;document.querySelectorAll("#viewSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render();});
document.querySelectorAll("#typeChips .chip").forEach(c=>c.onclick=()=>{
  state.type=c.dataset.type;document.querySelectorAll("#typeChips .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");render();});

render();
</script>
</body>
</html>
